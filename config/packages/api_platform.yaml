api_platform:
    title: À la bonne station — API
    version: 1.0.0
    # L'app mobile consomme du JSON simple ; on garde JSON-LD pour l'outillage.
    formats:
        json: ['application/json']
        jsonld: ['application/ld+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
