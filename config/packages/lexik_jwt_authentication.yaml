lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Identité du token = email (le provider Doctrine charge les users par email).
    # Sinon Lexik prendrait le claim "username" = getUsername() = le pseudo, non chargeable par email.
    user_id_claim: email
